name: Build New API image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare pinned source with DSH patch
        run: scripts/prepare.sh "$RUNNER_TEMP/new-api"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - name: Focused authentication test
        working-directory: ${{ runner.temp }}/new-api
        run: go test ./middleware ./model -run '^TestDSHOIDCUserAuthRequiresSignedAudienceClientAndBinding$' -count=1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/new-api
          file: ${{ runner.temp }}/new-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
